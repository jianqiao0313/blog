name: Build and deploy to Aliyun OSS

# Builds the site on every push to main, then incrementally uploads dist/ to the
# OSS bucket. Upload is content-based (rclone --checksum compares MD5/ETag, not
# mtime), so a fresh build only transfers files whose content actually changed.
# Hashed Astro/Pagefind assets are uploaded but not deleted during deploy: CDN
# edges can keep older HTML for a short window, and that HTML still points at
# old hashes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; cancel an in-flight one when a newer push lands.
concurrency:
  group: deploy-oss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build site
        run: pnpm build

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Incremental upload dist/ to OSS
        env:
          # rclone remote "OSS" configured entirely via env vars (no config file).
          RCLONE_CONFIG_OSS_TYPE: s3
          RCLONE_CONFIG_OSS_PROVIDER: Alibaba
          RCLONE_CONFIG_OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          RCLONE_CONFIG_OSS_SECRET_ACCESS_KEY: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          RCLONE_CONFIG_OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          # "default" => uploaded objects inherit the bucket's ACL (works for both
          # a public static-website bucket and a private + CDN setup).
          RCLONE_CONFIG_OSS_ACL: default
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_OSS_ACCESS_KEY_ID:-}" ]; then
            echo "::warning::OSS secrets are not configured — build succeeded but upload was skipped."
            echo "Add OSS_ACCESS_KEY_ID, OSS_ACCESS_KEY_SECRET and OSS_ENDPOINT in the repo's Settings → Secrets and variables → Actions."
            exit 0
          fi

          # Safety guard: never mirror a possibly empty/broken build over the
          # live bucket (sync deletes, so an empty dist would wipe the site).
          if [ ! -f ./dist/index.html ]; then
            echo "::error::dist/index.html is missing — refusing to sync a possibly empty build."
            exit 1
          fi

          # Upload all current files first so newly published HTML never points
          # at an asset that has not reached the bucket yet.
          rclone copy ./dist "OSS:jianqiao0313-blog" \
            --checksum \
            --fast-list \
            --s3-no-check-bucket \
            --transfers 16 \
            --checkers 16 \
            --stats-one-line \
            -v

          # Mirror route HTML and other non-fingerprinted files, but keep old
          # /_astro and pagefind hashes. CDN edges may serve older HTML until
          # their TTL expires; deleting old hashes during that window causes
          # asset 404s.
          rclone sync ./dist "OSS:jianqiao0313-blog" \
            --checksum \
            --fast-list \
            --s3-no-check-bucket \
            --exclude "/_astro/**" \
            --exclude "/pagefind/**" \
            --transfers 16 \
            --checkers 16 \
            --stats-one-line \
            -v

      - name: Refresh Aliyun CDN cache
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          ALIBABA_CLOUD_REGION: ${{ vars.ALIBABA_CLOUD_REGION || 'cn-hangzhou' }}
          CDN_REFRESH_OBJECT_PATH: ${{ vars.CDN_REFRESH_OBJECT_PATH || 'https://lvjianqiao.com/' }}
        run: |
          set -euo pipefail
          if [ -z "${ALIBABA_CLOUD_ACCESS_KEY_ID:-}" ]; then
            echo "::warning::OSS secrets are not configured — CDN refresh was skipped."
            exit 0
          fi

          /bin/bash -c "$(curl -fsSL https://aliyuncli.alicdn.com/install.sh)"
          aliyun version
          aliyun plugin install --names cdn

          aliyun cdn RefreshObjectCaches \
            --region "$ALIBABA_CLOUD_REGION" \
            --ObjectPath "$CDN_REFRESH_OBJECT_PATH" \
            --ObjectType Directory
